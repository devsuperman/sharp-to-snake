[tool.pytest.ini_options]
testpaths = ["tests", "final_project/tests", "migration_project/tests"]
pythonpath = [".", "final_project", "migration_project"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "migration_project"]
extend-exclude = [
    ".venv",
    "migration_project/legacy",  # deliberately bad code: it is the thing being migrated
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Lessons deliberately show anti-patterns (mutable defaults, bare except, ...).
"lessons/*" = ["B006", "B008", "B904", "B905", "E501", "E722", "SIM105", "SIM108", "SIM401", "UP"]

[tool.mypy]
python_version = "3.12"
